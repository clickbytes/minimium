[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/protocol",
    "crates/telemetry",
    "apps/server",
    "apps/client",
    "apps/ctl",
    "apps/loadtest",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
