version = 1

# Current Cargo package ownership; no placeholder package declarations.
[[package]]
name = "minimium-core"
role = "engine-domain"
responsibility = "Foundational identifiers, player profiles, authenticated principal values and server-granted permission bits with no project dependencies."
forbidden_dependencies = ["minimium-astronomy", "minimium-protocol", "minimium-platform", "minimium-assets", "minimium-procgen", "minimium-sectors", "minimium-telemetry", "minimium-commands", "minimium-world", "minimium-environment", "minimium-renderer", "minimium-game-sample"]

[[package]]
name = "minimium-world"
role = "engine-domain"
responsibility = "World definitions, topologies, addressing, static geometry, maps, bounded monotone peak-relief definitions, and world-scoped entity/component contracts with exact schemas and bounded change tracking."
forbidden_dependencies = ["minimium-astronomy", "minimium-protocol", "minimium-platform", "minimium-assets", "minimium-procgen", "minimium-sectors", "minimium-telemetry", "minimium-commands", "minimium-environment", "minimium-simulation", "minimium-renderer", "minimium-game-sample"]

[[package]]
name = "minimium-simulation"
role = "engine-domain"
responsibility = "Mutable simulation state, movement, collision indexing/queries, combat, snapshots and step results."
forbidden_dependencies = ["minimium-astronomy", "minimium-protocol", "minimium-platform", "minimium-assets", "minimium-procgen", "minimium-sectors", "minimium-telemetry", "minimium-commands", "minimium-environment", "minimium-renderer", "minimium-game-sample"]

[[package]]
name = "minimium-environment"
role = "engine-domain"
responsibility = "World clock and environment values, renderer-independent sky observations, solar-system catalogue, seasonal/regional climate scenarios, physical elevation scaling, lightweight climate evaluation, independent relief influence on climate and shared site-based replayable surface state."
forbidden_dependencies = ["minimium-astronomy", "minimium-protocol", "minimium-platform", "minimium-assets", "minimium-procgen", "minimium-sectors", "minimium-telemetry", "minimium-renderer", "minimium-game-sample"]

[[package]]
name = "minimium-astronomy"
role = "adapter"
responsibility = "Client-side astronomy backend and FFI adapter."

[[package]]
name = "minimium-procgen"
role = "engine-domain"
responsibility = "Seeded procedural generation, typed generation errors, sector geometry, terrain sampling through the shared Earth relief curve, separate presentation ground/sea-level sampling and typed surface/normal/coverage and landform sampling through prepared geography ports, with validated presentation recipes independent of generator identity."
forbidden_dependencies = ["minimium-asset-io", "minimium-renderer", "minimium-game-sample"]

[[package]]
name = "minimium-sectors"
role = "engine-domain"
responsibility = "Bounded sector request, ticket, readiness and cache lifecycle."
forbidden_dependencies = ["minimium-renderer", "minimium-game-sample"]

[[package]]
name = "minimium-assets"
role = "engine-domain"
responsibility = "Map, OBJ, sky catalogue, authored world definitions, bounded terrain material manifests/KTX2 and fractional land-cover parsing and validation."
forbidden_dependencies = ["minimium-astronomy", "minimium-procgen", "minimium-asset-io", "minimium-renderer", "minimium-game-sample"]

[[package]]
name = "minimium-asset-io"
role = "adapter"
responsibility = "Bounded authored asset access, typed asset errors, prepared GEBCO/WorldCover geography, bounded material HTTP client/server adapters, and an 8-GiB-default leased content cache with cross-process reservation and digest locking."
forbidden_dependencies = ["minimium-server", "minimium-client", "minimium-renderer", "wgpu", "winit"]

[[package]]
name = "minimium-commands"
role = "engine-domain"
responsibility = "Generic command parsing, typed errors, property descriptors, and immutable layered configuration resolution with no domain-specific vocabulary."
forbidden_dependencies = ["minimium-astronomy", "minimium-protocol", "minimium-platform", "minimium-assets", "minimium-procgen", "minimium-sectors", "minimium-telemetry", "minimium-server", "minimium-client", "minimiumctl", "minimium-loadtest", "minimium-renderer", "minimium-game-sample"]

[[package]]
name = "minimium-platform"
role = "adapter"
responsibility = "Resolved process path values, durable files, process identity, locking and bounded local administration transport with versioned structured error decoding."
forbidden_dependencies = ["minimium-world", "minimium-environment", "minimium-procgen", "minimium-sectors", "minimium-assets", "minimium-protocol", "minimium-telemetry"]

[[package]]
name = "minimium-storage"
role = "adapter"
responsibility = "Version-10 save format, exact streaming/counting encoders, bounded aggregate component payloads and world metadata, keyed snapshot reservations, immutable revisioned SaveSnapshot values, PlayerStore and bounded persistence worker, emitting storage-domain diagnostics through the neutral contract."
forbidden_dependencies = ["minimium-astronomy", "minimium-protocol", "minimium-procgen", "minimium-sectors", "minimium-server", "minimium-client"]

[[package]]
name = "minimium-transport"
role = "adapter"
responsibility = "Bounded byte flushing and socket transport primitives without game protocol policy."
forbidden_dependencies = ["minimium-astronomy", "minimium-procgen", "minimium-sectors", "minimium-server", "minimium-client", "wgpu", "winit"]

[[package]]
name = "minimium-protocol"
role = "engine-domain"
responsibility = "Versioned message models, codecs, validation and wire limits."
forbidden_dependencies = ["minimium-renderer", "minimium-game-sample"]

[[package]]
name = "minimium-diagnostics"
role = "engine-domain"
responsibility = "Bounded domain diagnostic event contract, controlled domain registry, stable event codes and nonblocking sink/logger API."
forbidden_dependencies = ["minimium-telemetry", "minimium-platform", "minimium-storage", "minimium-transport", "wgpu", "winit"]

[[package]]
name = "minimium-gameplay"
role = "engine-domain"
responsibility = "Neutral static module, command, system and component-registration contracts, owner-lane simulation ticks, per-world startup lifecycle views, bounded world-effect buffers, deterministic dependency ordering and typed uniqueness/cycle validation."
forbidden_dependencies = ["minimium-server-runtime", "minimium-storage", "minimium-transport", "minimium-telemetry", "minimium-platform", "minimium-game-sample", "wgpu", "winit"]

[[package]]
name = "minimium-localization"
role = "engine-domain"
responsibility = "Typed UI message identifiers and arguments, Fluent catalogs, locale fallback and formatting independent of window, GPU and transport."
forbidden_dependencies = ["minimium-server-runtime", "minimium-storage", "minimium-transport", "minimium-game-sample", "wgpu", "winit"]

[[package]]
name = "minimium-telemetry"
role = "infrastructure"
responsibility = "Per-process run directories, bounded asynchronous JSONL diagnostics writer and retention/rotation policy, metrics, process sampling and optional allocation instrumentation."

[[package]]
name = "minimium-server"
role = "application"
responsibility = "Server process entry point, application path resolution, diagnostic sink lifetime, allocator selection, sample world/combat composition, explicit developer authentication policy and argument forwarding."
forbidden_dependencies = ["minimium-astronomy", "wgpu", "wgpu-core", "wgpu-hal", "winit"]

[[package]]
name = "minimium-server-runtime"
role = "runtime"
responsibility = "Authoritative server lifecycle, nonblocking pluggable authentication admission, server-enforced principal permissions, simulation, transport and persistence, consuming neutral world/combat inputs and fixed-domain diagnostics from the application."
forbidden_dependencies = ["minimium-game-sample", "minimium-astronomy", "wgpu", "wgpu-core", "wgpu-hal", "winit"]

[[package]]
name = "minimium-client"
role = "application"
responsibility = "Desktop and terminal client application state (typed settings, world catalog, overview and transfer lifecycle), client shell, input, console and optional bounded audio adapter; renderer presentation and bounded materialization/bolid-history workers; local server composition; consumes client runtime contracts without placing GPU handles in application state."

[[package]]
name = "minimium-client-runtime"
role = "runtime"
responsibility = "Nonblocking protocol session with typed failures, application-supplied world-content resolver contract, content download worker/deadline and GPU readiness coordination, connection controller, connector, typed local-server launch settings with bounded offline server-config preview and captured environment, local-server ownership and stderr diagnostics, fixed-step prediction, reconciliation/interpolation and environment synchronization."
forbidden_dependencies = ["minimium-astronomy", "wgpu", "wgpu-core", "wgpu-hal", "winit", "minimium-client", "minimium-server"]

[[package]]
name = "minimium-game-sample"
role = "game-content"
responsibility = "Shared demo map, stable seed, planet presets and relief-curve configuration adapters, deterministic periodic material recipes and physical relief scales, climate scenario presets, sample planet/dungeon scenario, demo celestial catalogue, sample gameplay module/component schemas and sample combat balance consumed by applications."
forbidden_dependencies = ["minimium-server", "minimium-client", "wgpu", "winit"]

[[package]]
name = "minimium-renderer"
role = "presentation"
# Terrain presentation includes stateless seeded planet-space coverage mosaics;
# these do not own persistent biome state or authoritative world generation.
# Renderer owns bounded patch caches, CPU vertex preparation, frame upload budgets
# and in-place GPU floating-origin rebasing; the client owns preparation workers.
# Renderer decodes validated material means, conforms dense LOD edges and removes
# radial curtains from presentation copies; global/local history uses UTC endpoints.
# Renderer owns shared camera-relative optical profiles, bounded atmosphere LUT
# compute/composition, regional fog presentation and optional GPU timestamp readback.
# Ambient cosmetic meteors (docs/adr/0013-ambient-meteors.md, implemented by
# E047-01..17): the CPU-only MeteorFrame/transient-light contract, its f64 physical
# metre -> f32 render-origin adapter and the shared GPU uniform live in
# minimium-renderer; minimium-client owns the local lifecycle and commands. Meteors
# add no server, protocol, save, world-entity or domain-environment change. E047-01
# landed the CPU-only contract and the wording below.
responsibility = "Presentation frame contracts including CPU-only RenderFrame, camera matrix preparation, render/UI vertex layouts, overlay pipelines and geometry conversion, window-independent surface-frame acquire/present operations, ordered frame encoding for shadow, main scene, atmosphere, clouds, UI and output, sky/Sun/marker, world and cloud pipelines, shared overview/FPP terrain and sea-level sphere selection, guarded overview frustum and cached coast-priority LOD, paired edge conformance and ocean shading, bounded UTC surface-atlas GPU ownership, atomic staged geometry upload and overview marker ownership, world geometry GPU catalog, planet visibility/LOD, visual quality and camera-fitted single-source shadows with world-space stabilization, pre-exposed HDR night lighting, depth target allocation, shadow GPU owner, caster geometry and uniform preparation, UI GPU resources, star catalogue instance preparation and GPU pipeline, linear scene output target/encode pipeline, visual lighting, deterministic bolid ablation presentation and point-source lighting, lunar illumination, WGSL sources, shared GPU frame buffers/bind group, Milky Way texture, celestial halo pipeline and Moon disk/sphere pipelines consumed by the client renderer, CPU-only ambient meteor frame contract with its physical-metre-to-render-origin adapter and deterministic bounded input, pure cosmetic meteor SI ablation and photometry, plus a fixed-capacity cosmetic emission producer sharing the bolid cloud-composition layer and a producer-neutral bounded transient-light frame uniform."
forbidden_dependencies = ["minimium-client", "minimium-client-runtime", "minimium-server-runtime", "minimium-protocol", "minimium-storage", "minimium-transport", "minimium-platform", "minimium-game-sample", "winit"]

[[package]]
name = "minimiumctl"
role = "application"
responsibility = "Administrative CLI over the local server endpoint."
forbidden_dependencies = ["minimium-astronomy", "wgpu", "wgpu-core", "wgpu-hal", "winit"]

[[package]]
name = "minimium-loadtest"
role = "application"
responsibility = "Headless network load scenario client."
