version = 1

# Independently resolved production feature graphs and actual compile consumers.
# These are complementary to the all-feature package rules below.
[[feature_contract]]
name = "renderer-cpu"
package = "minimium-renderer"
no_default_features = true
features = []
example = "cpu_frame"
forbidden_dependencies = ["wgpu", "wgpu-core", "wgpu-hal", "winit", "minimium-astronomy"]
forbidden_package_features = { minimium-renderer = ["gpu"] }

[[feature_contract]]
name = "terminal-client"
package = "minimium-client"
no_default_features = true
features = []
forbidden_dependencies = ["wgpu", "wgpu-core", "wgpu-hal", "winit", "minimium-astronomy"]
forbidden_package_features = { minimium-client = ["desktop", "desktop-audio"], minimium-renderer = ["gpu"] }

[[feature_contract]]
name = "embedded-server"
package = "minimium-server-runtime"
no_default_features = true
features = []
example = "embedded_host"
forbidden_dependencies = ["minimium-game-sample", "minimium-renderer", "wgpu", "wgpu-core", "wgpu-hal", "winit", "minimium-astronomy"]
forbidden_package_features = {}

[[package]]
name = "minimium-terrain"
role = "engine-domain"
responsibility = "Committed crater height fields, sparse world-space volumetric terrain, bounded revision-checked edits from validated generic radial deformations with supplied allowed-material sets, CPU Marching Cubes meshes and spatial read queries. Terrain does not infer gameplay tool kinds or material policy. Hosts provide immutable generation through a read port."
forbidden_dependencies = ["minimium-procgen", "minimium-fluids", "minimium-storage", "minimium-protocol", "minimium-platform", "minimium-renderer", "minimium-game-sample", "wgpu", "winit"]

[[package]]
name = "minimium-fluids"
role = "engine-domain"
responsibility = "Bounded local water state, finite reservoir level-volume curves, MAC pressure projection, geometric phase transport, explicit ocean exchange accounting, water observations and conservative endpoint transfers through immutable geometry ports."
forbidden_dependencies = ["minimium-terrain", "minimium-procgen", "minimium-storage", "minimium-protocol", "minimium-platform", "minimium-renderer", "minimium-game-sample", "wgpu", "winit"]

# Current Cargo package ownership; no placeholder package declarations.
[[package]]
name = "minimium-core"
role = "engine-domain"
responsibility = "Foundational identifiers, player profiles with domain-owned hexadecimal parse errors, authenticated principal values and server-granted permission bits with no project dependencies. File error classification and path context belong to adapters."
forbidden_dependencies = ["minimium-astronomy", "minimium-protocol", "minimium-platform", "minimium-assets", "minimium-procgen", "minimium-sectors", "minimium-telemetry", "minimium-commands", "minimium-world", "minimium-environment", "minimium-renderer", "minimium-game-sample"]

[[package]]
name = "minimium-world"
role = "engine-domain"
responsibility = "World definitions, topologies, addressing, static geometry, maps, bounded monotone peak-relief definitions, and world-scoped entity/component contracts with exact schemas, required descriptor payload validation, ordered world-scoped entity changes, bounded change tracking, and separate entity/component membership revisions. Also owns neutral terrain/spatial/inventory/tool-kind/material-set/water contracts, shared character position/dimension/radial-frame/eye geometry, bounded impact-body components and their owner-side ServerOnly registration, crater stamp values and independent remnant snapshots. Tool kinds carry no hardcoded material-removal policy; inventory installs application-supplied item slots."
forbidden_dependencies = ["minimium-astronomy", "minimium-protocol", "minimium-platform", "minimium-assets", "minimium-procgen", "minimium-sectors", "minimium-telemetry", "minimium-commands", "minimium-environment", "minimium-simulation", "minimium-renderer", "minimium-game-sample"]

[[package]]
name = "minimium-simulation"
role = "engine-domain"
responsibility = "Mutable simulation state, movement, collision indexing/queries, local-frame combat using shared character geometry, snapshots and step results. Owns immutable coherent spatial-geometry publications with movement indices, a full-map combat baseline and exact-sector replacements, and requires a server-certified full-ray coverage plan matched to the publication revision and shot ray before combat mutates health. Also owns pure SI impact integration through a terrain port, incremental collision partitions, bounded authoritative tool admission using application-supplied per-kind definitions selected from confirmed inventory, and shared swimming through neutral water observations."
forbidden_dependencies = ["minimium-astronomy", "minimium-protocol", "minimium-platform", "minimium-assets", "minimium-procgen", "minimium-sectors", "minimium-telemetry", "minimium-commands", "minimium-environment", "minimium-renderer", "minimium-game-sample"]

[[package]]
name = "minimium-environment"
role = "engine-domain"
responsibility = "World clock and environment values, renderer-independent sky observations, solar-system catalogue with reserved Sun/Moon identities and typed collision rejection, seasonal/regional climate scenarios, physical elevation scaling, lightweight climate evaluation, independent relief influence on climate and shared site-based replayable surface state. WeatherModel owns private source values, derived scales and cloud cache, with validated atomic scenario reconfiguration; cloud physical support dimensions/quantization, density and UTC evolution contain no presentation debug or tessellation API. Weather propagates the host terrain port's associated error through climate, cover and cloud preparation."
forbidden_dependencies = ["minimium-astronomy", "minimium-protocol", "minimium-platform", "minimium-assets", "minimium-procgen", "minimium-sectors", "minimium-telemetry", "minimium-renderer", "minimium-game-sample"]

[[package]]
name = "minimium-astronomy"
role = "adapter"
responsibility = "Client-side astronomy backend and FFI adapter, consuming the environment catalogue's reserved Sun/Moon identities."

[[package]]
name = "minimium-procgen"
role = "engine-domain"
responsibility = "Seeded procedural generation, typed generation and sampling errors, validated atomic planet construction requiring matching prepared Earth geography, sector geometry, terrain sampling through the shared Earth relief curve and supplied validated relief-sampling policy, separate presentation ground/sea-level sampling and typed surface/normal/coverage and landform sampling through prepared geography ports, with validated presentation recipes independent of generator identity. Consumes explicit current-terrain inputs separately from immutable geography and owns the typed SectorContentVersion contract over monotone edit, remnant and volume revisions. Supplies validated manifest/map-bound terrain material profiles, volumetric base-field sampling and guarded shared render/collision excavation meshes with typed material cross-sections, connected finite-water catalogs and independent meteorite object meshes."
forbidden_dependencies = ["minimium-asset-io", "minimium-renderer", "minimium-game-sample"]

[[package]]
name = "minimium-sectors"
role = "engine-domain"
responsibility = "Bounded sector request, ticket, readiness and cache lifecycle."
forbidden_dependencies = ["minimium-renderer", "minimium-game-sample"]

[[package]]
name = "minimium-assets"
role = "engine-domain"
responsibility = "Map, OBJ, sky catalogue, authored world definitions, bounded terrain material manifests/KTX2 and fractional land-cover parsing and validation."
forbidden_dependencies = ["minimium-astronomy", "minimium-procgen", "minimium-asset-io", "minimium-renderer", "minimium-game-sample"]

[[package]]
name = "minimium-asset-io"
role = "adapter"
responsibility = "Bounded authored asset access, explicit material-manifest loading and validated client packaging, typed asset errors, prepared GEBCO/WorldCover geography, bounded material HTTP client/server adapters with private verified file snapshots retained until their workers exit, and an 8-GiB-default leased content cache with cross-process reservation and digest locking."
