[[package]]
name = "minimium-commands"
role = "engine-domain"
responsibility = "Generic command parsing, typed errors, property descriptors, and immutable layered configuration resolution with no domain-specific vocabulary."
forbidden_dependencies = ["minimium-astronomy", "minimium-protocol", "minimium-platform", "minimium-assets", "minimium-procgen", "minimium-sectors", "minimium-telemetry", "minimium-server", "minimium-client", "minimiumctl", "minimium-loadtest", "minimium-renderer", "minimium-game-sample"]

[[package]]
name = "minimium-platform"
role = "adapter"
responsibility = "Resolved process path values, durable files, process identity, locking and bounded local administration transport with versioned structured error decoding."
forbidden_dependencies = ["minimium-world", "minimium-environment", "minimium-procgen", "minimium-sectors", "minimium-assets", "minimium-protocol", "minimium-telemetry"]

[[package]]
name = "minimium-storage"
role = "adapter"
responsibility = "Version-11 save format, exact streaming/counting encoders, bounded aggregate component payloads and world metadata, keyed snapshot reservations and lifetime-bound prepared reservations for ordered entity changes, immutable revisioned SaveSnapshot values, PlayerStore and bounded persistence worker behind public backend/service ports with distinct enqueue acceptance and durable completion, emitting storage-domain diagnostics through the neutral contract. The explicit FileStorageBackend owns snapshot/journal preflight, load/replay and file-backed worker opening; the bounded MemoryStorageBackend implements the same codecs and service contracts with a single lease, explicit pending/completed results and volatile retention across reopen. Owns bounded flight checkpoints and the excavation result journal with coherent fluid checkpoints, independent crater stamps, impact-body results, catalog integrity, durable acknowledgements, replay and compaction."
forbidden_dependencies = ["minimium-astronomy", "minimium-protocol", "minimium-procgen", "minimium-sectors", "minimium-server", "minimium-client"]

[[package]]
name = "minimium-transport"
role = "adapter"
responsibility = "Host-owned game and administrative TCP listeners, sockets, bounded framing/codecs, partial-write queues and stable transport IDs behind typed TransportPort and GameOutputPort contracts; no gameplay admission or command policy."
forbidden_dependencies = ["minimium-astronomy", "minimium-procgen", "minimium-sectors", "minimium-server", "minimium-client", "wgpu", "winit"]

[[package]]
name = "minimium-protocol"
role = "engine-domain"
responsibility = "Protocol-21 message models, bounded terrain/fluid/crater image parts, contextual revisions, resynchronization, codecs, validation and wire limits."
forbidden_dependencies = ["minimium-renderer", "minimium-game-sample"]

[[package]]
name = "minimium-diagnostics"
role = "engine-domain"
responsibility = "Bounded domain diagnostic event contract, controlled domain registry, stable event codes and nonblocking sink/logger API."
forbidden_dependencies = ["minimium-telemetry", "minimium-platform", "minimium-storage", "minimium-transport", "wgpu", "winit"]

[[package]]
name = "minimium-gameplay"
role = "engine-domain"
responsibility = "Neutral static module, command, system and component-registration contracts, including bounded keyset-paginated read-only ModuleCommandContext world/entity/player/component views with typed cursors and errors, bounded UTF-8 module command results and validated error codes, plus typed world-effect emission; owner-lane simulation ticks, per-world startup lifecycle views, bounded world-effect buffers and aligned effect-batch outcome contracts, one validated system/built-in schedule graph with stable operation IDs, fixed extension/publication boundaries and typed uniqueness/cycle/phase validation. Exposes generic entity interactions, compatible crater snapshots and a borrowed read-only current planetary terrain query; domain configuration is passed explicitly by the application."
forbidden_dependencies = ["minimium-server-runtime", "minimium-storage", "minimium-transport", "minimium-telemetry", "minimium-platform", "minimium-game-sample", "wgpu", "winit"]

[[package]]
name = "minimium-localization"
role = "engine-domain"
responsibility = "Typed UI message identifiers and arguments, Fluent catalogs, locale fallback and formatting independent of window, GPU and transport."
forbidden_dependencies = ["minimium-server-runtime", "minimium-storage", "minimium-transport", "minimium-game-sample", "wgpu", "winit"]

[[package]]
name = "minimium-telemetry"
role = "infrastructure"
responsibility = "Per-process run directories, bounded asynchronous JSONL diagnostics writer and retention/rotation policy, metrics, process sampling and optional allocation instrumentation."

[[package]]
name = "minimium-server"
role = "application"
responsibility = "Server process entry point, application path resolution, diagnostic sink lifetime, allocator selection, sample world/combat composition, explicit developer authentication policy, transport listener binding and adapter construction, process bootstrap/lifecycle services, and argument forwarding."
forbidden_dependencies = ["minimium-astronomy", "wgpu", "wgpu-core", "wgpu-hal", "winit"]

[[package]]
name = "minimium-server-runtime"
role = "runtime"
responsibility = "Authoritative server lifecycle, nonblocking pluggable authentication admission, server-enforced principal permissions, simulation and typed transport-event coordination, consuming neutral world/combat inputs and fixed-domain diagnostics from the application. The host supplies TransportPort and GameOutputPort; runtime receives stable-ID events and emits typed responses but owns no listeners, sockets, byte buffers or codecs. Public path-free PreparedRuntime and RuntimeSettings values carry loaded world state and opened storage/content/process ports into the single runtime constructor. Public ServerRuntime submit/query/step and shutdown expose this same owner, with bounded shared command admission, typed execution/cancellation results and immutable bounded keyset-paginated views with revision-bound cursors. The host provides prepared execution pools and monotonic/UTC samples; construction starts no threads or effects. The existing process wrapper drives the same step after locked file/config/content bootstrap before constructing those values; process endpoint/status cleanup is a lifecycle port, not runtime filesystem access. Owns a separate 300-second monotonic pending-transfer deadline and shared cancellation cleanup retaining active membership, releasing exclusive sector work and reporting the source context. Executes the validated built-in tick graph with unchanged shutdown and per-stage effect-publication boundaries. Owns actor-keyed fire/chat cooldown admission in GameState; admission supplies identity, context and transport capacity. Administrative commands return typed success payloads or typed bounded failures; terminal and admin adapters format immutable reports without deriving success from text. Module commands receive bounded neutral read views and emit effects through the same atomic entity/partial-transfer executor as gameplay systems; replies carry typed per-effect outcomes. Composes the engine impact component before application module schemas, protects impact-owned entities from generic mutation, keeps private live impact state distinct from its last-durable-checkpoint entity projection, atomically commits staged world entity stores with prepared storage reservations, and reports bounded per-effect outcomes with independently started or typed-rejected transfers. Validates per-world material-profile and resolved-relief-policy bindings before terrain publication. Owns explicit validated impact/hydrology timing policy: impacts advance once per eligible authoritative fixed tick, while hydrology uses monotonic cadence/retry deadlines; fixed simulation steps and impact body-age checkpoints remain distinct clocks, and busy work does not catch up. Impact integration is bounded to 100 ms per eligible tick and hydrology solver steps to one second. Owns authoritative impacts and excavation: a private ExcavationCoordinator controls one preparation/durable-write slot, journal acknowledgement matching, cancellation and proof-gated publication through narrow work/world ports, with shared-pool preparation, profile inventories, fluid stepping and checkpoints, durable atomic terrain/collision publication and spatial replication. Tool preparation selects an application-supplied definition from confirmed inventory and sends validated material/radius parameters to neutral terrain; the developer grant is an application-supplied, catalog-validated fixed slot set. Sector streaming publishes movement/tool collision and per-sector combat replacements in one revision-checked spatial bundle; bounded combat-ray demand uses separate sector pins/readiness from movement and returns Busy without replaying a not-ready shot. Exposes every command payload through an exhaustive immutable bounded host view with explicit rejected/executed/partial effect state, independent stop status, bounded error details and persistence queue versus completion visibility; output adapters share this typed view. Adds validated public RuntimeCommand constructors for every current built-in and registered module identity plus bounded argv; text adapters produce the same intent for the shared executor."
forbidden_dependencies = ["minimium-game-sample", "minimium-astronomy", "wgpu", "wgpu-core", "wgpu-hal", "winit"]

[[package]]
name = "minimium-client"
role = "application"
# Developer tool HUD adapts confirmed inventory/action results and the shared
# simulation first-hit query; presentation never authorizes terrain mutations.
responsibility = "Desktop and terminal client application state (shared canonical property catalog, validated typed startup/settings records, active world catalog, one context/ticket-bound staged transfer data record, overview), GPU-independent ClientBootstrap for world/path/profile/schema/auth/cache/resolver/controller composition with explicit host presentation capabilities, one typed client-action executor shared by input, console and terminal with local queue outcomes distinct from authoritative results, one typed text command parser/executor shared by console, terminal and bounded developer stdin with caller-owned output formatting, explicit renderer presentation operations with terminal-unavailable results, client shell, input with a shared physical-control catalog for configuration and device events, console and optional bounded audio adapter; renderer presentation and bounded materialization/bolid-history workers, including recognized-content profile resolution and tool previews consuming the selected tool definition; adapts confirmed inventory to sample model indices and sample CPU tool-model vertices to the renderer's neutral catalog; local server composition; consumes client runtime transfer lifecycle/readiness contracts without placing GPU handles in application state. ClientApplication is shared by desktop and terminal for connection, action execution, session updates, active-world content and a monotonic-time/input step API. ClientApplication::step owns connection polling, CPU message application, fixed-step timing, prediction/action queueing and candidate collision-readiness rollback; terminal invokes the same step with prediction omitted. DesktopHost schedules steps against a monotonic 16 ms deadline independently of redraw and prepares/presents the latest immutable view from RedrawRequested without polling or prediction. DesktopHost also owns a lifetime monotonic cosmetic presentation epoch; it passes elapsed Duration into the renderer CPU frame contract independently of world UTC, while gpu_frame::environment_uniform is deterministic for identical inputs. The step preserves the existing capped simulation dt and prediction-before-session-poll order while keeping mutable game, connection, action executor and world catalog private. DesktopHost owns ClientApplication and GPU Renderer as peers; it prepares immutable CPU views and submits active collision readiness tagged with context and terrain version, or bootstrap readiness tagged with instance, manifest and map fingerprint. Candidate reports also identify their position; the application checks them and planetary water coverage before retaining predicted movement. CPU content readiness and GPU staging never authorize world changes."

[[package]]
name = "minimium-client-runtime"
role = "runtime"
responsibility = "Nonblocking protocol session with typed failures, application-supplied world-content resolver contract, content download worker/deadline and shared transfer lifecycle/readiness coordination, connection controller enforcing session/attempt/cleanup exclusion before startup, connector, typed local-server launch settings with bounded offline server-config preview and captured environment, local-server ownership and stderr diagnostics, fixed-step prediction, reconciliation/interpolation and environment synchronization. Owns protocol-21 context-bound object replicas and staged terrain/fluid/crater batches, water catalog and resolved material-profile and planet-relief-policy forwarding, swimming prediction and terrain synchronization readiness. ClientSession owns one active context-bound world-content bundle and at most one pending bundle linked to its resolver ticket and transfer ID; only authoritative commit swaps map, geography, material profile, relief policy and water catalog together. Runtime validates duplicate prepare identity and rejects missing or mismatched generated-planet relief policy before publication; it owns the single TransitionReady queue/retry. Hosts report readiness through TransferTicket."
forbidden_dependencies = ["minimium-astronomy", "wgpu", "wgpu-core", "wgpu-hal", "winit", "minimium-client", "minimium-server"]

[[package]]
name = "minimium-game-sample"
role = "game-content"
responsibility = "Shared demo map, stable seed, planet presets and relief-curve configuration adapters, deterministic periodic material recipes and physical relief scales with explicit sample cook composition, climate scenario presets, sample planet/dungeon scenario including seeded route, spawn, entrance marker and resolved planet relief-sampling policy, demo celestial catalogue, sample gameplay module/component schemas and sample combat balance consumed by applications. Supplies per-ToolKind reach/radius/allowed-material definitions with a shared cooldown and fixed developer inventory grants, camera-local CPU Shovel/Pickaxe viewmodel geometry and ToolKind-to-model association, canonical 1500 mm sample terrain material profile, developer tool definitions, rare-impact probability and meteorite physical/gameplay profile."
forbidden_dependencies = ["minimium-server", "minimium-client", "wgpu", "winit"]

[[package]]
name = "minimium-renderer"
role = "presentation"
# Terrain presentation includes stateless seeded planet-space coverage mosaics;
# these do not own persistent biome state or authoritative world generation.
# Renderer owns bounded patch caches keyed by world material-profile binding, CPU vertex preparation, frame upload budgets
# and in-place GPU floating-origin rebasing; the client owns preparation workers.
# Rebase layouts derive strides/normal offsets from the renderer vertex types
# and pass them to WGSL for both resident and staged geometry.
# Renderer decodes validated material means, conforms dense LOD edges and removes
# radial curtains from presentation copies; global/local history uses UTC endpoints.
# Renderer partitions conformed ground/sea into complementary shoreline polygons
# and stabilizes camera-height and local walking LOD selection without changing generation.
# Renderer owns shared camera-relative optical profiles, bounded atmosphere LUT
# compute/composition, regional fog presentation and optional GPU timestamp readback.
# Ambient cosmetic meteors (docs/adr/0013-ambient-meteors.md, implemented by
# E047-01..17): the CPU-only MeteorFrame/transient-light contract, its f64 physical
# metre -> f32 render-origin adapter and the shared GPU uniform live in
# minimium-renderer; minimium-client owns the local lifecycle and commands. Meteors
# add no server, protocol, save, world-entity or domain-environment change. E047-01
# landed the CPU-only contract and the wording below.
responsibility = "Presentation frame contracts available without GPU/astronomy features: RenderFrame, PreparedSector, camera/environment uniform data, CPU geometry preparation and frame exposure; camera matrix preparation, render/UI vertex layouts, bounded neutral CPU viewmodel catalog and generic viewmodel vertex upload, overlay pipelines and geometry conversion, window-independent surface-frame acquire/present operations, ordered frame encoding for shadow, main scene, atmosphere, clouds, viewmodel, UI and output, sky/Sun/marker, world pipelines consuming context/publication-matched remote player geometry and cloud pipelines with whole-frame upload preflight and rejection preserving the previous publication, shared overview/FPP terrain and sea-level sphere selection, guarded overview frustum and cached coast-priority LOD, paired edge conformance and ocean shading, bounded UTC surface-atlas GPU ownership, atomic staged geometry upload keyed by GeometryStageId with a two-owner cap, owner-scoped cleanup and one shared rotating per-frame upload budget, overview marker ownership, world geometry GPU catalog, planet visibility/LOD, CPU cloud debug and tessellation selection with bounded detail and sampling costs, visual quality and camera-fitted single-source shadows with world-space stabilization, pre-exposed HDR night lighting, depth target allocation, shadow GPU owner, caster geometry and uniform preparation, UI GPU resources, star catalogue instance preparation and GPU pipeline, linear scene output target/encode pipeline, visual lighting, deterministic bolid ablation presentation and point-source lighting, lunar illumination, WGSL sources, shared GPU frame buffers/bind group, Milky Way texture, celestial halo pipeline and Moon disk/sphere pipelines consumed by the client renderer, CPU-only ambient meteor frame contract with its physical-metre-to-render-origin adapter and deterministic bounded input, pure cosmetic meteor SI ablation and photometry, plus a fixed-capacity cosmetic emission producer sharing the bolid cloud-composition layer and an independent CPU TransientLightFrame with four ranked sources, explicit emitting radii, shared planet coordinate adaptation, meteor producer adapter and unchanged bounded transient-light uniform. Presents supplied camera-local first-person meshes in the existing viewmodel pass, authoritative excavation normals/materials, local water interfaces, reservoir-level shorelines and underwater attenuation."
forbidden_dependencies = ["minimium-client", "minimium-client-runtime", "minimium-server-runtime", "minimium-protocol", "minimium-storage", "minimium-transport", "minimium-platform", "minimium-game-sample", "winit"]

[[package]]
name = "minimiumctl"
role = "application"
responsibility = "Administrative CLI over the local server endpoint."
forbidden_dependencies = ["minimium-astronomy", "wgpu", "wgpu-core", "wgpu-hal", "winit"]

[[package]]
name = "minimium-loadtest"
role = "application"
responsibility = "Headless network load scenario client."
