version = 1

[[package]]
name = "minimium-terrain"
role = "engine-domain"
responsibility = "Committed crater height fields, sparse world-space volumetric terrain, bounded revision-checked edits, CPU Marching Cubes meshes and spatial read queries. Hosts provide immutable generation through a read port."
forbidden_dependencies = ["minimium-procgen", "minimium-fluids", "minimium-storage", "minimium-protocol", "minimium-platform", "minimium-renderer", "minimium-game-sample", "wgpu", "winit"]

[[package]]
name = "minimium-fluids"
role = "engine-domain"
responsibility = "Bounded local water state, finite reservoir level-volume curves, MAC pressure projection, geometric phase transport, explicit ocean exchange accounting, water observations and conservative endpoint transfers through immutable geometry ports."
forbidden_dependencies = ["minimium-terrain", "minimium-procgen", "minimium-storage", "minimium-protocol", "minimium-platform", "minimium-renderer", "minimium-game-sample", "wgpu", "winit"]

# Current Cargo package ownership; no placeholder package declarations.
[[package]]
name = "minimium-core"
role = "engine-domain"
responsibility = "Foundational identifiers, player profiles with domain-owned hexadecimal parse errors, authenticated principal values and server-granted permission bits with no project dependencies. File error classification and path context belong to adapters."
forbidden_dependencies = ["minimium-astronomy", "minimium-protocol", "minimium-platform", "minimium-assets", "minimium-procgen", "minimium-sectors", "minimium-telemetry", "minimium-commands", "minimium-world", "minimium-environment", "minimium-renderer", "minimium-game-sample"]

[[package]]
name = "minimium-world"
role = "engine-domain"
responsibility = "World definitions, topologies, addressing, static geometry, maps, bounded monotone peak-relief definitions, and world-scoped entity/component contracts with exact schemas, required descriptor payload validation, ordered world-scoped entity changes and bounded change tracking. Also owns neutral terrain/spatial/tool/water contracts, shared character position/dimension/radial-frame/eye geometry, bounded impact-body components and their owner-side ServerOnly registration, crater stamp values and independent remnant snapshots."
forbidden_dependencies = ["minimium-astronomy", "minimium-protocol", "minimium-platform", "minimium-assets", "minimium-procgen", "minimium-sectors", "minimium-telemetry", "minimium-commands", "minimium-environment", "minimium-simulation", "minimium-renderer", "minimium-game-sample"]

[[package]]
name = "minimium-simulation"
role = "engine-domain"
responsibility = "Mutable simulation state, movement, collision indexing/queries, local-frame combat using shared character geometry, snapshots and step results. Owns immutable coherent spatial-geometry publications with movement indices, a full-map combat baseline and exact-sector replacements, and requires a server-certified full-ray coverage plan matched to the publication revision and shot ray before combat mutates health. Also owns pure SI impact integration through a terrain port, incremental collision partitions and bounded authoritative tool admission rules and shared swimming through neutral water observations."
forbidden_dependencies = ["minimium-astronomy", "minimium-protocol", "minimium-platform", "minimium-assets", "minimium-procgen", "minimium-sectors", "minimium-telemetry", "minimium-commands", "minimium-environment", "minimium-renderer", "minimium-game-sample"]

[[package]]
name = "minimium-environment"
role = "engine-domain"
responsibility = "World clock and environment values, renderer-independent sky observations, solar-system catalogue, seasonal/regional climate scenarios, physical elevation scaling, lightweight climate evaluation, independent relief influence on climate and shared site-based replayable surface state. WeatherModel owns private source values, derived scales and cloud cache, with validated atomic scenario reconfiguration. Weather propagates the host terrain port's associated error through climate, cover and cloud preparation."
forbidden_dependencies = ["minimium-astronomy", "minimium-protocol", "minimium-platform", "minimium-assets", "minimium-procgen", "minimium-sectors", "minimium-telemetry", "minimium-renderer", "minimium-game-sample"]

[[package]]
name = "minimium-astronomy"
role = "adapter"
responsibility = "Client-side astronomy backend and FFI adapter."

[[package]]
name = "minimium-procgen"
role = "engine-domain"
responsibility = "Seeded procedural generation, typed generation and sampling errors, validated atomic planet construction requiring matching prepared Earth geography, sector geometry, terrain sampling through the shared Earth relief curve, separate presentation ground/sea-level sampling and typed surface/normal/coverage and landform sampling through prepared geography ports, with validated presentation recipes independent of generator identity. Consumes explicit current-terrain inputs separately from immutable geography and owns the typed SectorContentVersion contract over monotone edit, remnant and volume revisions. Supplies volumetric base-field sampling, guarded shared render/collision excavation meshes, material cross-sections, connected finite-water catalogs and independent meteorite object meshes."
forbidden_dependencies = ["minimium-asset-io", "minimium-renderer", "minimium-game-sample"]

[[package]]
name = "minimium-sectors"
role = "engine-domain"
responsibility = "Bounded sector request, ticket, readiness and cache lifecycle."
forbidden_dependencies = ["minimium-renderer", "minimium-game-sample"]

[[package]]
name = "minimium-assets"
role = "engine-domain"
responsibility = "Map, OBJ, sky catalogue, authored world definitions, bounded terrain material manifests/KTX2 and fractional land-cover parsing and validation."
forbidden_dependencies = ["minimium-astronomy", "minimium-procgen", "minimium-asset-io", "minimium-renderer", "minimium-game-sample"]

[[package]]
name = "minimium-asset-io"
role = "adapter"
responsibility = "Bounded authored asset access, typed asset errors, prepared GEBCO/WorldCover geography, bounded material HTTP client/server adapters, and an 8-GiB-default leased content cache with cross-process reservation and digest locking."
forbidden_dependencies = ["minimium-server", "minimium-client", "minimium-renderer", "wgpu", "winit"]

[[package]]
name = "minimium-commands"
role = "engine-domain"
responsibility = "Generic command parsing, typed errors, property descriptors, and immutable layered configuration resolution with no domain-specific vocabulary."
forbidden_dependencies = ["minimium-astronomy", "minimium-protocol", "minimium-platform", "minimium-assets", "minimium-procgen", "minimium-sectors", "minimium-telemetry", "minimium-server", "minimium-client", "minimiumctl", "minimium-loadtest", "minimium-renderer", "minimium-game-sample"]

[[package]]
name = "minimium-platform"
role = "adapter"
responsibility = "Resolved process path values, durable files, process identity, locking and bounded local administration transport with versioned structured error decoding."
forbidden_dependencies = ["minimium-world", "minimium-environment", "minimium-procgen", "minimium-sectors", "minimium-assets", "minimium-protocol", "minimium-telemetry"]

[[package]]
name = "minimium-storage"
role = "adapter"
responsibility = "Version-11 save format, exact streaming/counting encoders, bounded aggregate component payloads and world metadata, keyed snapshot reservations and lifetime-bound prepared reservations for ordered entity changes, immutable revisioned SaveSnapshot values, PlayerStore and bounded persistence worker, emitting storage-domain diagnostics through the neutral contract. Owns bounded flight checkpoints and the excavation result journal with coherent fluid checkpoints, independent crater stamps, impact-body results, catalog integrity, durable acknowledgements, replay and compaction."
forbidden_dependencies = ["minimium-astronomy", "minimium-protocol", "minimium-procgen", "minimium-sectors", "minimium-server", "minimium-client"]

[[package]]
name = "minimium-transport"
role = "adapter"
responsibility = "Bounded byte flushing and socket transport primitives without game protocol policy."
forbidden_dependencies = ["minimium-astronomy", "minimium-procgen", "minimium-sectors", "minimium-server", "minimium-client", "wgpu", "winit"]

[[package]]
name = "minimium-protocol"
role = "engine-domain"
responsibility = "Protocol-21 message models, bounded terrain/fluid/crater image parts, contextual revisions, resynchronization, codecs, validation and wire limits."
forbidden_dependencies = ["minimium-renderer", "minimium-game-sample"]

[[package]]
name = "minimium-diagnostics"
role = "engine-domain"
responsibility = "Bounded domain diagnostic event contract, controlled domain registry, stable event codes and nonblocking sink/logger API."
forbidden_dependencies = ["minimium-telemetry", "minimium-platform", "minimium-storage", "minimium-transport", "wgpu", "winit"]

[[package]]
name = "minimium-gameplay"
role = "engine-domain"
responsibility = "Neutral static module, command, system and component-registration contracts, owner-lane simulation ticks, per-world startup lifecycle views, bounded world-effect buffers and aligned effect-batch outcome contracts, deterministic dependency ordering and typed uniqueness/cycle validation. Exposes generic entity interactions, compatible crater snapshots and a borrowed read-only current planetary terrain query; domain configuration is passed explicitly by the application."
forbidden_dependencies = ["minimium-server-runtime", "minimium-storage", "minimium-transport", "minimium-telemetry", "minimium-platform", "minimium-game-sample", "wgpu", "winit"]

[[package]]
name = "minimium-localization"
role = "engine-domain"
responsibility = "Typed UI message identifiers and arguments, Fluent catalogs, locale fallback and formatting independent of window, GPU and transport."
forbidden_dependencies = ["minimium-server-runtime", "minimium-storage", "minimium-transport", "minimium-game-sample", "wgpu", "winit"]

[[package]]
name = "minimium-telemetry"
role = "infrastructure"
responsibility = "Per-process run directories, bounded asynchronous JSONL diagnostics writer and retention/rotation policy, metrics, process sampling and optional allocation instrumentation."

[[package]]
name = "minimium-server"
role = "application"
responsibility = "Server process entry point, application path resolution, diagnostic sink lifetime, allocator selection, sample world/combat composition, explicit developer authentication policy and argument forwarding."
forbidden_dependencies = ["minimium-astronomy", "wgpu", "wgpu-core", "wgpu-hal", "winit"]

[[package]]
name = "minimium-server-runtime"
role = "runtime"
responsibility = "Authoritative server lifecycle, nonblocking pluggable authentication admission, server-enforced principal permissions, simulation, transport and persistence, consuming neutral world/combat inputs and fixed-domain diagnostics from the application. Owns actor-keyed fire/chat cooldown admission in GameState; admission supplies identity, context and transport capacity. Composes the engine impact component before application module schemas, protects impact-owned entities from generic mutation, keeps private live impact state distinct from its last-durable-checkpoint entity projection, atomically commits staged world entity stores with prepared storage reservations, and reports bounded per-effect outcomes with independently started or typed-rejected transfers. Owns authoritative impacts and excavation: shared-pool preparation, profile inventories, fluid stepping and checkpoints, durable atomic terrain/collision publication and spatial replication. Sector streaming publishes movement/tool collision and per-sector combat replacements in one revision-checked spatial bundle; bounded combat-ray demand uses separate sector pins/readiness from movement and returns Busy without replaying a not-ready shot."
forbidden_dependencies = ["minimium-game-sample", "minimium-astronomy", "wgpu", "wgpu-core", "wgpu-hal", "winit"]

[[package]]
name = "minimium-client"
role = "application"
# Developer tool HUD adapts confirmed inventory/action results and the shared
# simulation first-hit query; presentation never authorizes terrain mutations.
responsibility = "Desktop and terminal client application state (shared canonical property catalog, validated typed startup/settings records, active world catalog, one context/ticket-bound staged transfer data record, overview), GPU-independent ClientBootstrap for world/path/profile/schema/auth/cache/resolver/controller composition with explicit host presentation capabilities, one typed client-action executor shared by input, console and terminal with local queue outcomes distinct from authoritative results, client shell, input with a shared physical-control catalog for configuration and device events, console and optional bounded audio adapter; renderer presentation and bounded materialization/bolid-history workers; local server composition; consumes client runtime transfer lifecycle/readiness contracts without placing GPU handles in application state."

[[package]]
name = "minimium-client-runtime"
role = "runtime"
responsibility = "Nonblocking protocol session with typed failures, application-supplied world-content resolver contract, content download worker/deadline and shared transfer lifecycle/readiness coordination, connection controller enforcing session/attempt/cleanup exclusion before startup, connector, typed local-server launch settings with bounded offline server-config preview and captured environment, local-server ownership and stderr diagnostics, fixed-step prediction, reconciliation/interpolation and environment synchronization. Owns protocol-21 context-bound object replicas and staged terrain/fluid/crater batches, water catalog preparation, swimming prediction and terrain synchronization readiness. ClientSession owns one active context-bound world-content bundle and at most one pending bundle linked to its resolver ticket and transfer ID; only authoritative commit swaps map, geography and water catalog together. Runtime validates duplicate prepare identity and owns the single TransitionReady queue/retry; hosts report readiness through TransferTicket."
forbidden_dependencies = ["minimium-astronomy", "wgpu", "wgpu-core", "wgpu-hal", "winit", "minimium-client", "minimium-server"]

[[package]]
name = "minimium-game-sample"
role = "game-content"
responsibility = "Shared demo map, stable seed, planet presets and relief-curve configuration adapters, deterministic periodic material recipes and physical relief scales, climate scenario presets, sample planet/dungeon scenario, demo celestial catalogue, sample gameplay module/component schemas and sample combat balance consumed by applications. Supplies tool profiles, material layer depth, developer tool definitions, rare-impact probability and meteorite physical/gameplay profile."
forbidden_dependencies = ["minimium-server", "minimium-client", "wgpu", "winit"]

[[package]]
name = "minimium-renderer"
role = "presentation"
# Terrain presentation includes stateless seeded planet-space coverage mosaics;
# these do not own persistent biome state or authoritative world generation.
# Renderer owns bounded patch caches, CPU vertex preparation, frame upload budgets
# and in-place GPU floating-origin rebasing; the client owns preparation workers.
# Rebase layouts derive strides/normal offsets from the renderer vertex types
# and pass them to WGSL for both resident and staged geometry.
# Renderer decodes validated material means, conforms dense LOD edges and removes
# radial curtains from presentation copies; global/local history uses UTC endpoints.
# Renderer partitions conformed ground/sea into complementary shoreline polygons
# and stabilizes camera-height and local walking LOD selection without changing generation.
# Renderer owns shared camera-relative optical profiles, bounded atmosphere LUT
# compute/composition, regional fog presentation and optional GPU timestamp readback.
# Ambient cosmetic meteors (docs/adr/0013-ambient-meteors.md, implemented by
# E047-01..17): the CPU-only MeteorFrame/transient-light contract, its f64 physical
# metre -> f32 render-origin adapter and the shared GPU uniform live in
# minimium-renderer; minimium-client owns the local lifecycle and commands. Meteors
# add no server, protocol, save, world-entity or domain-environment change. E047-01
# landed the CPU-only contract and the wording below.
responsibility = "Presentation frame contracts available without GPU/astronomy features: RenderFrame, PreparedSector, camera/environment uniform data, CPU geometry preparation and frame exposure; camera matrix preparation, render/UI vertex layouts, overlay pipelines and geometry conversion, window-independent surface-frame acquire/present operations, ordered frame encoding for shadow, main scene, atmosphere, clouds, viewmodel, UI and output, sky/Sun/marker, world pipelines consuming context/publication-matched remote player geometry and cloud pipelines with whole-frame upload preflight and rejection preserving the previous publication, shared overview/FPP terrain and sea-level sphere selection, guarded overview frustum and cached coast-priority LOD, paired edge conformance and ocean shading, bounded UTC surface-atlas GPU ownership, atomic staged geometry upload keyed by GeometryStageId with a two-owner cap, owner-scoped cleanup and one shared rotating per-frame upload budget, overview marker ownership, world geometry GPU catalog, planet visibility/LOD, visual quality and camera-fitted single-source shadows with world-space stabilization, pre-exposed HDR night lighting, depth target allocation, shadow GPU owner, caster geometry and uniform preparation, UI GPU resources, star catalogue instance preparation and GPU pipeline, linear scene output target/encode pipeline, visual lighting, deterministic bolid ablation presentation and point-source lighting, lunar illumination, WGSL sources, shared GPU frame buffers/bind group, Milky Way texture, celestial halo pipeline and Moon disk/sphere pipelines consumed by the client renderer, CPU-only ambient meteor frame contract with its physical-metre-to-render-origin adapter and deterministic bounded input, pure cosmetic meteor SI ablation and photometry, plus a fixed-capacity cosmetic emission producer sharing the bolid cloud-composition layer and a producer-neutral bounded transient-light frame uniform. Presents low-poly first-person shovel and pickaxe viewmodels from confirmed inventory state, authoritative excavation normals/materials, local water interfaces, reservoir-level shorelines and underwater attenuation."
forbidden_dependencies = ["minimium-client", "minimium-client-runtime", "minimium-server-runtime", "minimium-protocol", "minimium-storage", "minimium-transport", "minimium-platform", "minimium-game-sample", "winit"]

[[package]]
name = "minimiumctl"
role = "application"
responsibility = "Administrative CLI over the local server endpoint."
forbidden_dependencies = ["minimium-astronomy", "wgpu", "wgpu-core", "wgpu-hal", "winit"]

[[package]]
name = "minimium-loadtest"
role = "application"
responsibility = "Headless network load scenario client."
