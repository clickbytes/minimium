version = 1

# Current package ownership. `planned` entries are remaining targets, not Cargo members.
[[package]]
name = "minimium-core"
role = "engine-domain"
responsibility = "Foundational identity and identifier primitives with no project dependencies."
forbidden_dependencies = ["minimium-astronomy", "minimium-protocol", "minimium-platform", "minimium-assets", "minimium-procgen", "minimium-sectors", "minimium-telemetry", "minimium-commands", "minimium-world", "minimium-environment", "minimium-renderer", "minimium-game-sample"]

[[package]]
name = "minimium-world"
role = "engine-domain"
responsibility = "World definitions, topologies, addressing, static geometry, maps, bounded monotone peak-relief definitions and component definitions."
forbidden_dependencies = ["minimium-astronomy", "minimium-protocol", "minimium-platform", "minimium-assets", "minimium-procgen", "minimium-sectors", "minimium-telemetry", "minimium-commands", "minimium-environment", "minimium-simulation", "minimium-renderer", "minimium-game-sample"]

[[package]]
name = "minimium-simulation"
role = "engine-domain"
responsibility = "Mutable simulation state, movement, collision indexing/queries, combat, snapshots and step results."
forbidden_dependencies = ["minimium-astronomy", "minimium-protocol", "minimium-platform", "minimium-assets", "minimium-procgen", "minimium-sectors", "minimium-telemetry", "minimium-commands", "minimium-environment", "minimium-renderer", "minimium-game-sample"]

[[package]]
name = "minimium-environment"
role = "engine-domain"
responsibility = "World clock and environment values, renderer-independent sky observations, solar-system catalogue, seasonal/regional climate scenarios, physical elevation scaling, lightweight climate evaluation, independent relief influence on climate and shared site-based replayable surface state."
forbidden_dependencies = ["minimium-astronomy", "minimium-protocol", "minimium-platform", "minimium-assets", "minimium-procgen", "minimium-sectors", "minimium-telemetry", "minimium-renderer", "minimium-game-sample"]

[[package]]
name = "minimium-astronomy"
role = "adapter"
responsibility = "Client-side astronomy backend and FFI adapter."

[[package]]
name = "minimium-procgen"
role = "engine-domain"
responsibility = "Seeded procedural generation, sector geometry, terrain sampling through the shared Earth relief curve, separate presentation ground/sea-level sampling and typed surface/normal/coverage and landform sampling through prepared geography ports, with validated presentation recipes independent of generator identity."
forbidden_dependencies = ["minimium-asset-io", "minimium-renderer", "minimium-game-sample"]

[[package]]
name = "minimium-sectors"
role = "engine-domain"
responsibility = "Bounded sector request, ticket, readiness and cache lifecycle."
forbidden_dependencies = ["minimium-renderer", "minimium-game-sample"]

[[package]]
name = "minimium-assets"
role = "engine-domain"
responsibility = "Map, OBJ, sky catalogue, authored world definitions, bounded terrain material manifests/KTX2 and fractional land-cover parsing and validation."
forbidden_dependencies = ["minimium-astronomy", "minimium-procgen", "minimium-asset-io", "minimium-renderer", "minimium-game-sample"]

[[package]]
name = "minimium-asset-io"
role = "adapter"
responsibility = "Bounded authored asset access, prepared GEBCO/WorldCover geography, HTTP material fetching and transactional hash-addressed package installation."
forbidden_dependencies = ["minimium-server", "minimium-client", "minimium-renderer", "wgpu", "winit"]

[[package]]
name = "minimium-commands"
role = "engine-domain"
responsibility = "Generic command parsing, typed errors, property descriptors, and immutable layered configuration resolution with no domain-specific vocabulary."
forbidden_dependencies = ["minimium-astronomy", "minimium-protocol", "minimium-platform", "minimium-assets", "minimium-procgen", "minimium-sectors", "minimium-telemetry", "minimium-server", "minimium-client", "minimiumctl", "minimium-loadtest", "minimium-renderer", "minimium-game-sample"]

[[package]]
name = "minimium-platform"
role = "adapter"
responsibility = "Durable files, process identity, locking and bounded local administration transport with versioned structured error decoding."
forbidden_dependencies = ["minimium-world", "minimium-environment", "minimium-procgen", "minimium-sectors", "minimium-assets", "minimium-protocol", "minimium-telemetry"]

[[package]]
name = "minimium-storage"
role = "adapter"
responsibility = "Save snapshot formats, validation, PlayerStore and bounded persistence worker."
forbidden_dependencies = ["minimium-astronomy", "minimium-protocol", "minimium-procgen", "minimium-sectors", "minimium-server", "minimium-client"]

[[package]]
name = "minimium-transport"
role = "adapter"
responsibility = "Bounded byte flushing and socket transport primitives without game protocol policy."
forbidden_dependencies = ["minimium-astronomy", "minimium-procgen", "minimium-sectors", "minimium-server", "minimium-client", "wgpu", "winit"]

[[package]]
name = "minimium-protocol"
role = "engine-domain"
responsibility = "Versioned message models, codecs, validation and wire limits."
forbidden_dependencies = ["minimium-renderer", "minimium-game-sample"]

[[package]]
name = "minimium-telemetry"
role = "infrastructure"
responsibility = "Metrics, process sampling and optional allocation instrumentation."

[[package]]
name = "minimium-server"
role = "application"
responsibility = "Server process entry point, allocator selection, sample world/combat composition and argument forwarding."
forbidden_dependencies = ["minimium-astronomy", "wgpu", "wgpu-core", "wgpu-hal", "winit"]

[[package]]
name = "minimium-server-runtime"
role = "runtime"
responsibility = "Authoritative server lifecycle, simulation, transport and persistence, consuming neutral world and combat inputs from the application."
forbidden_dependencies = ["minimium-game-sample", "minimium-astronomy", "wgpu", "wgpu-core", "wgpu-hal", "winit"]

[[package]]
name = "minimium-client"
role = "application"
responsibility = "Client shell, bounded planet materialization and presentation workers, console and local server composition; consumes client runtime contracts."

[[package]]
name = "minimium-client-runtime"
role = "runtime"
responsibility = "Nonblocking protocol session, content download worker/deadline and GPU readiness coordination, connection controller, connector, typed local-server launch settings with bounded offline server-config preview and captured environment, local-server ownership and stderr diagnostics, fixed-step prediction, reconciliation/interpolation and environment synchronization."
forbidden_dependencies = ["minimium-astronomy", "wgpu", "wgpu-core", "wgpu-hal", "winit", "minimium-client", "minimium-server"]

[[package]]
name = "minimium-game-sample"
role = "game-content"
responsibility = "Shared demo map, stable seed, planet presets and relief-curve configuration adapters, deterministic periodic material recipes and physical relief scales, climate scenario presets, sample planet/dungeon scenario, demo celestial catalogue and sample combat balance consumed by applications."
forbidden_dependencies = ["minimium-server", "minimium-client", "wgpu", "winit"]

[[package]]
name = "minimium-renderer"
role = "presentation"
# Terrain presentation includes stateless seeded planet-space coverage mosaics;
# these do not own persistent biome state or authoritative world generation.
# Renderer owns bounded patch caches, CPU vertex preparation, frame upload budgets
# and in-place GPU floating-origin rebasing; the client owns preparation workers.
# Renderer decodes validated material means, conforms dense LOD edges and removes
# radial curtains from presentation copies; global/local history uses UTC endpoints.
# Renderer owns shared camera-relative optical profiles, bounded atmosphere LUT
# compute/composition, regional fog presentation and optional GPU timestamp readback.
responsibility = "Presentation frame contracts including CPU-only RenderFrame, camera matrix preparation, render/UI vertex layouts, overlay pipelines and geometry conversion, window-independent surface-frame acquire/present operations, ordered frame encoding for shadow, main scene, atmosphere, clouds, UI and output, sky/Sun/marker, world and cloud pipelines, shared overview/FPP terrain and sea-level sphere selection, guarded overview frustum and cached coast-priority LOD, paired edge conformance and ocean shading, bounded UTC surface-atlas GPU ownership, atomic staged geometry upload and overview marker ownership, world geometry GPU catalog, planet visibility/LOD, visual quality and camera-fitted single-source shadows with world-space stabilization, pre-exposed HDR night lighting, depth target allocation, shadow GPU owner, caster geometry and uniform preparation, UI GPU resources, star catalogue instance preparation and GPU pipeline, linear scene output target/encode pipeline, visual lighting, lunar illumination, WGSL sources, shared GPU frame buffers/bind group, Milky Way texture, celestial halo pipeline and Moon disk/sphere pipelines consumed by the client renderer."
forbidden_dependencies = ["minimium-client", "minimium-client-runtime", "minimium-server-runtime", "minimium-protocol", "minimium-storage", "minimium-transport", "minimium-game-sample", "winit"]

[[package]]
name = "minimiumctl"
role = "application"
responsibility = "Administrative CLI over the local server endpoint."
forbidden_dependencies = ["minimium-astronomy", "wgpu", "wgpu-core", "wgpu-hal", "winit"]

[[package]]
name = "minimium-loadtest"
role = "application"
responsibility = "Headless network load scenario client."

[planned]
domains = []
adapters = []
runtimes = []
renderer = []
sample_game = []
