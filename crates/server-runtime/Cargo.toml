[package]
name = "minimium-server-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
minimium-assets = { path = "../assets" }
minimium-asset-io = { path = "../asset-io" }
minimium-platform = { path = "../platform" }
minimium-core = { path = "../core" }
minimium-environment = { path = "../environment" }
minimium-commands = { path = "../commands" }
minimium-world = { path = "../world" }
minimium-simulation = { path = "../simulation" }
minimium-storage = { path = "../storage" }
minimium-transport = { path = "../transport" }
minimium-protocol = { path = "../protocol" }
minimium-procgen = { path = "../procgen" }
minimium-sectors = { path = "../sectors" }
minimium-telemetry = { path = "../telemetry" }
minimium-diagnostics = { path = "../diagnostics" }
minimium-gameplay = { path = "../gameplay" }
ron = "0.12.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
minimium-game-sample = { path = "../../games/sample" }

[features]
default = []
allocation-metrics = ["minimium-telemetry/allocation-metrics"]
