[package]
name = "minimium-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
minimium-server-runtime = { path = "../../crates/server-runtime" }
minimium-telemetry = { path = "../../crates/telemetry", optional = true, features = ["allocation-metrics"] }

[features]
default = []
allocation-metrics = ["dep:minimium-telemetry", "minimium-server-runtime/allocation-metrics"]
