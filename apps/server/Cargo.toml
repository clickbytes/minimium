[package]
name = "minimium-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
minimium-assets = { path = "../../crates/assets" }
minimium-platform = { path = "../../crates/platform" }
minimium-core = { path = "../../crates/core" }
minimium-protocol = { path = "../../crates/protocol" }
minimium-procgen = { path = "../../crates/procgen" }
minimium-weather = { path = "../../crates/weather" }
minimium-sectors = { path = "../../crates/sectors" }
minimium-telemetry = { path = "../../crates/telemetry" }
ron = "0.12.3"
serde = { version = "1", features = ["derive"] }

[features]
default = []
allocation-metrics = ["minimium-telemetry/allocation-metrics"]
