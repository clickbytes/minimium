[scenario]
name = "clustered"
clients = 100
duration_seconds = 60
server_lanes = "1"
generator_threads = 1
map = "games/sample/maps/performance.map"
bind = "127.0.0.1"
game_port = 47104
data_dir = ".minimium-loadtest/clustered-100-lanes-1"
server_command = "minimium-server run --headless --max-players 100 --threads 1 --bind 127.0.0.1 --game-port 47104 --data-dir .minimium-loadtest/clustered-100-lanes-1 --map games/sample/maps/performance.map"
generator_args = ["--address", "127.0.0.1:47104", "--scenario", "clustered", "--clients", "100", "--seconds", "60", "--threads", "1", "--format", "json", "--scenario-id", "clustered-100-lanes-1", "--server-data-dir", ".minimium-loadtest/clustered-100-lanes-1"]
loadtest_command = "minimium-loadtest --address 127.0.0.1:47104 --scenario clustered --clients 100 --seconds 60 --threads 1 --format json --scenario-id clustered-100-lanes-1 --server-data-dir .minimium-loadtest/clustered-100-lanes-1"
