[scenario]
name = "clustered"
clients = 2
duration_seconds = 60
server_lanes = "2"
generator_threads = 1
map = "games/sample/maps/performance.map"
bind = "127.0.0.1"
game_port = 47102
data_dir = ".minimium-loadtest/clustered-2-lanes-2"
server_command = "minimium-server run --headless --max-players 2 --threads 2 --bind 127.0.0.1 --game-port 47102 --data-dir .minimium-loadtest/clustered-2-lanes-2 --map games/sample/maps/performance.map"
generator_args = ["--address", "127.0.0.1:47102", "--scenario", "clustered", "--clients", "2", "--seconds", "60", "--threads", "1", "--format", "json", "--scenario-id", "clustered-2-lanes-2", "--server-data-dir", ".minimium-loadtest/clustered-2-lanes-2"]
loadtest_command = "minimium-loadtest --address 127.0.0.1:47102 --scenario clustered --clients 2 --seconds 60 --threads 1 --format json --scenario-id clustered-2-lanes-2 --server-data-dir .minimium-loadtest/clustered-2-lanes-2"
