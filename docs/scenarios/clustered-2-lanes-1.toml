[scenario]
name = "clustered"
clients = 2
duration_seconds = 60
server_lanes = "1"
generator_threads = 1
map = "games/sample/maps/performance.map"
bind = "127.0.0.1"
game_port = 47101
data_dir = ".minimium-loadtest/clustered-2-lanes-1"
