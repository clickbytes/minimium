generator_args = ["--address", "127.0.0.1:47101", "--scenario", "clustered", "--clients", "2", "--seconds", "60", "--threads", "1", "--format", "json", "--scenario-id", "clustered-2-lanes-1", "--server-data-dir", ".minimium-loadtest/clustered-2-lanes-1"]
loadtest_command = "minimium-loadtest --address 127.0.0.1:47101 --scenario clustered --clients 2 --seconds 60 --threads 1 --format json --scenario-id clustered-2-lanes-1 --server-data-dir .minimium-loadtest/clustered-2-lanes-1"
