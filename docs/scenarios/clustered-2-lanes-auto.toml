[scenario]
name = "clustered"
clients = 2
duration_seconds = 60
server_lanes = "auto"
generator_threads = 1
map = "games/sample/maps/performance.map"
bind = "127.0.0.1"
game_port = 47103
data_dir = ".minimium-loadtest/clustered-2-lanes-auto"
server_command = "minimium-server run --headless --max-players 2 --threads auto --bind 127.0.0.1 --game-port 47103 --data-dir .minimium-loadtest/clustered-2-lanes-auto --map games/sample/maps/performance.map"
generator_args = ["--address", "127.0.0.1:47103", "--scenario", "clustered", "--clients", "2", "--seconds", "60", "--threads", "1", "--format", "json", "--scenario-id", "clustered-2-lanes-auto", "--server-data-dir", ".minimium-loadtest/clustered-2-lanes-auto"]
loadtest_command = "minimium-loadtest --address 127.0.0.1:47103 --scenario clustered --clients 2 --seconds 60 --threads 1 --format json --scenario-id clustered-2-lanes-auto --server-data-dir .minimium-loadtest/clustered-2-lanes-auto"
