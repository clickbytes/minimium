generator_args = ["--address", "127.0.0.1:47113", "--scenario", "dispersed", "--clients", "100", "--seconds", "60", "--threads", "1", "--format", "json", "--scenario-id", "dispersed-100-lanes-1", "--server-data-dir", ".minimium-loadtest/dispersed-100-lanes-1"]
loadtest_command = "minimium-loadtest --address 127.0.0.1:47113 --scenario dispersed --clients 100 --seconds 60 --threads 1 --format json --scenario-id dispersed-100-lanes-1 --server-data-dir .minimium-loadtest/dispersed-100-lanes-1"
