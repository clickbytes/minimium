generator_args = ["--address", "127.0.0.1:47111", "--scenario", "dispersed", "--clients", "2", "--seconds", "60", "--threads", "1", "--format", "json", "--scenario-id", "dispersed-2-lanes-2", "--server-data-dir", ".minimium-loadtest/dispersed-2-lanes-2"]
loadtest_command = "minimium-loadtest --address 127.0.0.1:47111 --scenario dispersed --clients 2 --seconds 60 --threads 1 --format json --scenario-id dispersed-2-lanes-2 --server-data-dir .minimium-loadtest/dispersed-2-lanes-2"
