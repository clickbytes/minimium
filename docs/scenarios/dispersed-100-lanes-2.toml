[scenario]
name = "dispersed"
clients = 100
duration_seconds = 60
server_lanes = "2"
generator_threads = 1
map = "games/sample/maps/performance.map"
bind = "127.0.0.1"
game_port = 47114
data_dir = ".minimium-loadtest/dispersed-100-lanes-2"
server_command = "minimium-server run --headless --max-players 100 --threads 2 --bind 127.0.0.1 --game-port 47114 --data-dir .minimium-loadtest/dispersed-100-lanes-2 --map games/sample/maps/performance.map"
generator_args = ["--address", "127.0.0.1:47114", "--scenario", "dispersed", "--clients", "100", "--seconds", "60", "--threads", "1", "--format", "json", "--scenario-id", "dispersed-100-lanes-2", "--server-data-dir", ".minimium-loadtest/dispersed-100-lanes-2"]
loadtest_command = "minimium-loadtest --address 127.0.0.1:47114 --scenario dispersed --clients 100 --seconds 60 --threads 1 --format json --scenario-id dispersed-100-lanes-2 --server-data-dir .minimium-loadtest/dispersed-100-lanes-2"
