[scenario]
name = "clustered"
clients = 500
duration_seconds = 60
server_lanes = "1"
generator_threads = 1
map = "games/sample/maps/performance.map"
bind = "127.0.0.1"
game_port = 47107
data_dir = ".minimium-loadtest/clustered-500-lanes-1"
server_command = "minimium-server run --headless --max-players 500 --threads 1 --bind 127.0.0.1 --game-port 47107 --data-dir .minimium-loadtest/clustered-500-lanes-1 --map games/sample/maps/performance.map"
generator_args = ["--address", "127.0.0.1:47107", "--scenario", "clustered", "--clients", "500", "--seconds", "60", "--threads", "1", "--format", "json", "--scenario-id", "clustered-500-lanes-1", "--server-data-dir", ".minimium-loadtest/clustered-500-lanes-1"]
loadtest_command = "minimium-loadtest --address 127.0.0.1:47107 --scenario clustered --clients 500 --seconds 60 --threads 1 --format json --scenario-id clustered-500-lanes-1 --server-data-dir .minimium-loadtest/clustered-500-lanes-1"
